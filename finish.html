<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DATA QUESTZ — Mission Complete</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="game-container">

        <header class="finish-header">

            <h1>
                🗺️ DATA QUESTZ
            </h1>

            <p>
                Mission Complete • Well Done!
            </p>

        </header>


        <section
            id="finish-screen"
            class="finish-screen active"
        >

            <div class="finish-content">

                <div class="finish-trophy">
                    🏆
                </div>

                <h2>
                    DATA QUESTZ MASTER!
                </h2>

                <p class="finish-message">
                    Congratulations! You completed all missions.
                </p>


                <div class="finish-stat">

                    <span class="finish-stat-label">
                        🎯 Final Score
                    </span>

                    <strong id="final-score">
                        0
                    </strong>

                </div>


                <div class="finish-stat">

                    <span class="finish-stat-label">
                        ✅ Correct Answers
                    </span>

                    <strong id="correct-answers">
                        0
                    </strong>

                </div>


                <div class="finish-stat">

                    <span class="finish-stat-label">
                        ❌ Wrong Answers
                    </span>

                    <strong id="wrong-answers">
                        0
                    </strong>

                </div>


                <div class="finish-stat">

                    <span class="finish-stat-label">
                        📊 Accuracy
                    </span>

                    <strong id="accuracy">
                        0%
                    </strong>

                </div>


                <div class="finish-stat">

                    <span class="finish-stat-label">
                        📚 Missions Completed
                    </span>

                    <strong id="missions-completed">
                        0 / 0
                    </strong>

                </div>


                <div class="finish-feedback">

                    <p id="finish-feedback">
                        Great job!
                    </p>

                </div>


                <div class="finish-performance">

                    <p>
                        ⭐ Your Performance
                    </p>

                    <div id="performance-stars">
                        ⭐⭐⭐⭐⭐
                    </div>

                </div>


                <div class="finish-buttons">

                    <button
                        id="finish-play-again-btn"
                        type="button"
                    >
                        🔄 Play Again
                    </button>

                    <button
                        id="finish-main-menu-btn"
                        type="button"
                    >
                        🏠 Main Menu
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="finish.js"></script>

</body>

</html>
